# Local development only. Credentials are intentionally simple.
# This container is Double-Take's only database; backend/.env DATABASE_URL points at it.
services:
  db:
    image: pgvector/pgvector:pg18
    container_name: double-take-db
    environment:
      POSTGRES_DB: double_take
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # pg18 images keep data under /var/lib/postgresql/18/, so mount the parent directory.
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
    name: double-take-pgdata
