# Local development only. Credentials are intentionally simple.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: double-take-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: doubletake
      POSTGRES_USER: doubletake
      POSTGRES_PASSWORD: doubletake
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doubletake -d doubletake"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
